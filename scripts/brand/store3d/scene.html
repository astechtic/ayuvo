<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 3D store screenshot scene. Rendered by scripts/brand/store3d/render.py with headless Chrome;
     every parameter comes from the URL hash (JSON). Not part of the website. -->
<style>
  @font-face { font-family: Manrope; src: url("../../../brand/fonts/Manrope[wght].ttf"); font-weight: 200 800; }
  @font-face { font-family: Fraunces; src: url("../../../brand/fonts/Fraunces[SOFT,WONK,opsz,wght].ttf"); font-weight: 100 900; }
  :root { --ink: #0F1412; --sub: #3B4642; --accent: #E8264F; --bg1: #FFF1F4; --bg2: #FFE3EA; --bg3: #F6EEFF; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(60% 45% at 85% 12%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(70% 50% at 10% 85%, var(--bg3) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    font-family: Manrope, sans-serif;
    color: var(--ink);
  }
  .copy { position: absolute; left: calc(var(--u) * 7.5); right: calc(var(--u) * var(--cr, 7.5)); top: calc(var(--u) * var(--ct, 9)); z-index: 5; }
  h1 {
    font-family: Manrope, sans-serif; font-weight: 800; letter-spacing: -0.035em;
    font-size: calc(var(--u) * var(--hs, 8.6)); line-height: 1.02; color: var(--ink);
  }
  h1 em {
    display: block; font-family: Fraunces, serif; font-style: italic; font-weight: 560;
    font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 96; letter-spacing: -0.02em;
    color: var(--accent); margin-top: calc(var(--u) * .6);
  }
  p.sub {
    margin-top: calc(var(--u) * 3); font-weight: 500; font-size: calc(var(--u) * var(--ss, 3.7));
    line-height: 1.32; color: var(--sub); max-width: 92%;
  }
  /* sparkles and bokeh */
  .dot { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 calc(var(--u)*1.2) rgba(255,255,255,.9); opacity: .85; }
  /* device */
  .stage { position: absolute; left: 0; right: 0; bottom: 0; top: 0; perspective: calc(var(--u) * 260); perspective-origin: 50% 40%; z-index: 3; }
  .device {
    position: absolute; left: 50%; width: var(--dw); height: var(--dh);
    transform-style: preserve-3d;
  }
  .layer { position: absolute; inset: 0; border-radius: var(--r); }
  .side { background: linear-gradient(90deg, #2a2f2d, #5b625f 40%, #1b1f1d); }
  .face {
    background: #050607; padding: var(--bz);
    box-shadow: inset 0 0 0 calc(var(--u)*.35) #3a403d, inset 0 0 0 calc(var(--u)*.7) #0b0d0c;
  }
  .screen { width: 100%; height: 100%; border-radius: calc(var(--r) - var(--bz)); overflow: hidden; position: relative; background: #000; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .glare { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 70%, rgba(255,255,255,.06) 100%); pointer-events: none; }
  .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 999px; z-index: 2; }
  .shadow { position: absolute; left: 50%; border-radius: 50%; background: radial-gradient(closest-side, rgba(40,10,25,.32), rgba(40,10,25,0)); filter: blur(calc(var(--u)*2)); z-index: 2; }
  /* floating objects */
  .obj { position: absolute; z-index: 4; filter: drop-shadow(0 calc(var(--u)*2.2) calc(var(--u)*2.6) rgba(60,20,40,.28)); }
  .obj.back { z-index: 2; filter: drop-shadow(0 calc(var(--u)*1.4) calc(var(--u)*2) rgba(60,20,40,.18)) blur(calc(var(--u)*.12)); }
  .obj svg { width: 100%; height: 100%; display: block; overflow: visible; }
</style>
</head>
<body>
<div class="copy"><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
<div class="stage"><div class="shadow" id="shadow"></div><div class="device" id="device"></div></div>
<div id="objs"></div>
<script>
const P = window.__P || JSON.parse(decodeURIComponent(location.hash.slice(1)));
const W = P.w, H = P.h, u = W / 100;            // 1u = 1% of width
const R = document.documentElement.style;
R.setProperty('--W', W + 'px'); R.setProperty('--H', H + 'px'); R.setProperty('--u', u + 'px');
for (const [k, v] of Object.entries(P.theme)) R.setProperty('--' + k, v);
for (const [k, v] of Object.entries(P.vars || {})) R.setProperty('--' + k, v);

document.getElementById('h1').innerHTML = P.title + '<em>' + P.accent + '</em>';
document.getElementById('sub').textContent = P.sub;

// ---- device ---------------------------------------------------------------------------------
const ios = P.platform === 'ios';
function makeDevice(D, image, dev, sh) {
  const dw = W * D.scale;                     // device width
  const dh = dw * D.aspect;
  dev.style.setProperty('--dw', dw + 'px'); dev.style.setProperty('--dh', dh + 'px');
  dev.style.setProperty('--r', (dw * (D.radius ?? (ios ? .145 : .105))) + 'px');
  dev.style.setProperty('--bz', (dw * (D.bezel ?? (ios ? .032 : .028))) + 'px');
  const devTop = H * D.top;
  dev.style.top = devTop + 'px';
  dev.style.marginLeft = (-dw / 2 + W * (D.dx || 0)) + 'px';
  dev.style.transform = `rotateX(${D.rx}deg) rotateY(${D.ry}deg) rotateZ(${D.rz}deg)`;
  const depth = Math.round(dw * (D.depth ?? .055));
  for (let i = depth; i >= 1; i--) {
    const s = document.createElement('div'); s.className = 'layer side';
    s.style.transform = `translateZ(${-i}px)`; dev.appendChild(s);
  }
  const face = document.createElement('div'); face.className = 'layer face';
  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<img src="${image}">` + '<div class="glare"></div>';
  face.appendChild(scr); dev.appendChild(face);
  sh.style.width = dw * 1.25 + 'px'; sh.style.height = dw * .22 + 'px';
  sh.style.marginLeft = (-dw * .625 + W * (D.dx || 0) + dw * .12) + 'px';
  sh.style.top = Math.min(H - dw * .14, devTop + dh * .97) + 'px';
}
makeDevice(P.device, P.image, document.getElementById('device'), document.getElementById('shadow'));
for (const [i, X] of (P.extraDevices || []).entries()) {   // more devices behind the main one
  const stage = document.createElement('div'); stage.className = 'stage'; stage.style.zIndex = 2 - (i % 2);
  const sh = document.createElement('div'); sh.className = 'shadow';
  const dev = document.createElement('div'); dev.className = 'device';
  stage.append(sh, dev); document.body.appendChild(stage);
  makeDevice(X.device, X.image, dev, sh);
}
if (P.inlineAccent) { const em = document.querySelector('h1 em'); em.style.display = 'inline'; em.style.marginLeft = '0.25em'; }
if (P.centerCopy) {
  const c = document.querySelector('.copy'); c.style.textAlign = 'center';
  document.getElementById('sub').style.margin = 'calc(var(--u) * 1.2) auto 0';
}
if (P.brand) {
  const b = document.createElement('div');
  b.style.cssText = `display:flex;align-items:center;justify-content:${P.centerCopy ? 'center' : 'flex-start'};gap:calc(var(--u)*1);margin-bottom:calc(var(--u)*1.2);font-family:Fraunces,serif;font-weight:600;font-variation-settings:"SOFT" 50,"opsz" 72;font-size:calc(var(--u)*${P.brand.size || 3.2});color:var(--ink);letter-spacing:-0.02em`;
  b.innerHTML = `<img src="${P.brand.mark}" style="height:1.15em">Ayuvo`;
  document.querySelector('.copy').prepend(b);
}

// ---- sparkles -------------------------------------------------------------------------------
let seed = P.seed || 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < (P.dots ?? 26); i++) {
  const d = document.createElement('div'); d.className = 'dot';
  const s = (rnd() * .7 + .25) * u; d.style.width = d.style.height = s + 'px';
  d.style.left = rnd() * W + 'px'; d.style.top = (H * .28 + rnd() * H * .72) + 'px';
  d.style.opacity = (.35 + rnd() * .6).toFixed(2); document.body.appendChild(d);
}

// ---- 3D clay objects (SVG, glossy radial gradients) ------------------------------------------
let gid = 0;
function grad(c1, c2, c3) {
  const id = 'g' + (gid++);
  return [id, `<radialGradient id="${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></radialGradient>`];
}
const hl = (cx, cy, rx, ry, rot = -30, o = .75) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="#fff" opacity="${o}"/>`;
const SH = {
  heart() { const [a, d] = grad('#FF9AB0', '#FF375F', '#B0123A');
    return `<defs>${d}</defs><path d="M50 88 C18 66 4 48 8 30 C12 12 34 6 50 24 C66 6 88 12 92 30 C96 48 82 66 50 88Z" fill="url(#${a})"/>${hl(30, 28, 12, 6)}`; },
  pill() { const [a, d1] = grad('#FFA3B7', '#FF4D71', '#C21843'); const [b, d2] = grad('#FFFFFF', '#F1EDF4', '#C9C1CF');
    return `<defs>${d1}${d2}</defs><g transform="rotate(-38 50 50)"><path d="M50 16 H50 V84 H50 A0 0 0 0 1 50 84" fill="none"/><rect x="30" y="8" width="40" height="84" rx="20" fill="url(#${b})"/><path d="M30 50 V28 A20 20 0 0 1 70 28 V50 Z" fill="url(#${a})"/>${hl(42, 24, 5, 10, 0, .8)}</g>`; },
  tablet() { const [a, d] = grad('#FFFFFF', '#EDE7F3', '#BDB3C8');
    return `<defs>${d}</defs><ellipse cx="50" cy="56" rx="40" ry="30" fill="#A99DB6"/><ellipse cx="50" cy="48" rx="40" ry="30" fill="url(#${a})"/><path d="M22 48 H78" stroke="#C9BFD3" stroke-width="3" stroke-linecap="round"/>${hl(36, 36, 10, 4, -10, .9)}`; },
  drop() { const [a, d] = grad('#BFE6FF', '#3BA4FF', '#0A5BD1');
    return `<defs>${d}</defs><path d="M50 6 C66 30 82 46 82 64 A32 32 0 0 1 18 64 C18 46 34 30 50 6Z" fill="url(#${a})"/>${hl(38, 52, 6, 12, 15, .8)}`; },
  apple() { const [a, d] = grad('#FF9C8F', '#F0383A', '#A3121D'); const [b, d2] = grad('#B9F28C', '#4CC24A', '#23812E');
    return `<defs>${d}${d2}</defs><path d="M50 30 C36 18 10 22 10 52 C10 76 30 94 42 92 C46 91 48 89 50 89 C52 89 54 91 58 92 C70 94 90 76 90 52 C90 22 64 18 50 30Z" fill="url(#${a})"/><path d="M51 30 C52 20 56 12 62 8" stroke="#6B3B1E" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M56 20 C64 8 80 8 84 12 C78 22 66 26 56 20Z" fill="url(#${b})"/>${hl(30, 44, 8, 13, 20, .7)}`; },
  leaf() { const [a, d] = grad('#C8F7A0', '#5CCB52', '#2A8C35');
    return `<defs>${d}</defs><path d="M14 86 C10 46 40 12 88 12 C90 60 60 92 14 86Z" fill="url(#${a})"/><path d="M18 82 C40 60 60 40 80 20" stroke="#E8FFD6" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".8"/>`; },
  flame() { const [a, d] = grad('#FFE07A', '#FF9A2E', '#E8481C');
    return `<defs>${d}</defs><path d="M50 6 C56 26 80 38 80 64 A30 30 0 0 1 20 64 C20 48 30 40 34 28 C40 38 44 42 46 44 C48 30 46 18 50 6Z" fill="url(#${a})"/>${hl(38, 60, 5, 11, 15, .6)}`; },
  dumbbell() { const [a, d] = grad('#8A939C', '#3D454D', '#16191C'); const [b, d2] = grad('#FF8CA4', '#FF375F', '#A9103A');
    return `<defs>${d}${d2}</defs><g transform="rotate(-28 50 50)"><rect x="24" y="45" width="52" height="10" rx="5" fill="url(#${a})"/><rect x="8" y="26" width="16" height="48" rx="7" fill="url(#${b})"/><rect x="76" y="26" width="16" height="48" rx="7" fill="url(#${b})"/><rect x="2" y="34" width="8" height="32" rx="4" fill="url(#${b})"/><rect x="90" y="34" width="8" height="32" rx="4" fill="url(#${b})"/>${hl(14, 36, 2.5, 8, 0, .8)}${hl(82, 36, 2.5, 8, 0, .8)}</g>`; },
  bolt() { const [a, d] = grad('#FFF2A6', '#FFC93C', '#E89A0E');
    return `<defs>${d}</defs><path d="M58 4 L18 56 H46 L38 96 L82 40 H54 Z" fill="url(#${a})" stroke="#F2B21C" stroke-width="2" stroke-linejoin="round"/>`; },
  moon() { const [a, d] = grad('#E6DCFF', '#9C7BFF', '#5B3BD6');
    return `<defs>${d}</defs><path d="M62 8 A42 42 0 1 0 92 66 A34 34 0 1 1 62 8Z" fill="url(#${a})"/>${hl(30, 42, 6, 12, 15, .6)}`; },
  doc() { const [a, d] = grad('#FFFFFF', '#F3F0F6', '#C9C2D1');
    return `<defs>${d}</defs><rect x="18" y="6" width="64" height="86" rx="10" fill="#B9AFC4" transform="translate(4 4)"/><rect x="18" y="6" width="64" height="86" rx="10" fill="url(#${a})"/><rect x="28" y="20" width="30" height="7" rx="3.5" fill="#FF4D71"/><rect x="28" y="36" width="44" height="5" rx="2.5" fill="#CFC6D8"/><rect x="28" y="48" width="44" height="5" rx="2.5" fill="#CFC6D8"/><rect x="28" y="60" width="32" height="5" rx="2.5" fill="#CFC6D8"/><path d="M30 76 l8 -6 l8 4 l10 -10 l10 6" stroke="#30B0C7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; },
  tube() { const [a, d] = grad('#FFFFFF', '#E9F6FA', '#B7D9E3'); const [b, d2] = grad('#FFB0C2', '#FF4D71', '#B5123E');
    return `<defs>${d}${d2}</defs><g transform="rotate(24 50 50)"><rect x="36" y="4" width="28" height="10" rx="4" fill="#5C6670"/><path d="M38 14 H62 V78 A12 12 0 0 1 38 78 Z" fill="url(#${a})" opacity=".95"/><path d="M38 46 H62 V78 A12 12 0 0 1 38 78 Z" fill="url(#${b})"/>${hl(44, 40, 2.5, 18, 0, .9)}</g>`; },
  bars() { const [a, d] = grad('#9EEAF5', '#30B0C7', '#137487'); const [b, d2] = grad('#FFB0C2', '#FF4D71', '#B5123E');
    return `<defs>${d}${d2}</defs><rect x="10" y="52" width="20" height="40" rx="6" fill="url(#${a})"/><rect x="40" y="30" width="20" height="62" rx="6" fill="url(#${b})"/><rect x="70" y="10" width="20" height="82" rx="6" fill="url(#${a})"/>${hl(16, 60, 2, 6, 0, .7)}${hl(46, 38, 2, 8, 0, .7)}${hl(76, 18, 2, 9, 0, .7)}`; },
  bell() { const [a, d] = grad('#FFE9A0', '#FFC23D', '#D98A08');
    return `<defs>${d}</defs><path d="M50 10 C30 10 22 28 22 46 V62 L12 76 H88 L78 62 V46 C78 28 70 10 50 10Z" fill="url(#${a})"/><circle cx="50" cy="84" r="8" fill="#E8A21A"/><circle cx="50" cy="8" r="5" fill="#E8A21A"/>${hl(36, 32, 5, 12, 10, .7)}`; },
  chat() { const [a, d] = grad('#FFB3C4', '#FF4D71', '#B91541');
    return `<defs>${d}</defs><path d="M14 18 H86 A10 10 0 0 1 96 28 V64 A10 10 0 0 1 86 74 H42 L22 92 V74 H14 A10 10 0 0 1 4 64 V28 A10 10 0 0 1 14 18Z" fill="url(#${a})"/><circle cx="32" cy="46" r="6" fill="#fff"/><circle cx="50" cy="46" r="6" fill="#fff"/><circle cx="68" cy="46" r="6" fill="#fff"/>${hl(24, 28, 10, 4, -5, .55)}`; },
  sparkle() { const [a, d] = grad('#FFF7C2', '#FFD84A', '#F0A20F');
    return `<defs>${d}</defs><path d="M50 4 C54 34 66 46 96 50 C66 54 54 66 50 96 C46 66 34 54 4 50 C34 46 46 34 50 4Z" fill="url(#${a})"/>`; },
  shield() { const [a, d] = grad('#A8F0C6', '#2FBF71', '#16824A');
    return `<defs>${d}</defs><path d="M50 4 L88 18 V46 C88 70 72 86 50 96 C28 86 12 70 12 46 V18 Z" fill="url(#${a})"/><path d="M32 50 L45 63 L70 36" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${hl(30, 26, 8, 4, -20, .55)}`; },
  lock() { const [a, d] = grad('#FFB0C2', '#FF4D71', '#B5123E');
    return `<defs>${d}</defs><path d="M30 44 V30 A20 20 0 0 1 70 30 V44" stroke="#8D96A0" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="16" y="42" width="68" height="52" rx="12" fill="url(#${a})"/><circle cx="50" cy="64" r="7" fill="#7A0E2C"/><rect x="47" y="66" width="6" height="14" rx="3" fill="#7A0E2C"/>${hl(28, 52, 8, 4, -10, .6)}`; },
  ring() { const [a, d] = grad('#FFB3C4', '#FF375F', '#A9103A');
    return `<defs>${d}</defs><circle cx="50" cy="50" r="34" fill="none" stroke="url(#${a})" stroke-width="18"/><path d="M30 30 A28 28 0 0 1 50 20" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>`; },
  sphere() { const [a, d] = grad(P.sphere1 || '#FFFFFF', P.sphere2 || '#FFC1CF', P.sphere3 || '#FF6B8A');
    return `<defs>${d}</defs><circle cx="50" cy="50" r="46" fill="url(#${a})"/>${hl(34, 32, 12, 7, -30, .8)}`; },
};
const box = document.getElementById('objs');
for (const o of P.objects) {
  const el = document.createElement('div'); el.className = 'obj' + (o.back ? ' back' : '');
  const s = o.size * u; el.style.width = el.style.height = s + 'px';
  el.style.left = (o.x * u - s / 2) + 'px'; el.style.top = (o.y * H / 100 - s / 2) + 'px';
  el.style.transform = `rotate(${o.rot || 0}deg)`;
  el.innerHTML = `<svg viewBox="0 0 100 100">${SH[o.kind]()}</svg>`;
  box.appendChild(el);
}
document.fonts.ready.then(() => { document.title = 'ready'; });
</script>
</body>
</html>
